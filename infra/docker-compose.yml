services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak-demo
    command:
      - start-dev
      - --import-realm
    environment:
      KC_HTTP_PORT: ${KEYCLOAK_PORT:-8080}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro

  api:
    build:
      context: ../backend
      dockerfile: src/KeycloakDemo.Api/Dockerfile
    container_name: keycloak-demo-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Keycloak__Authority: http://keycloak:8080/realms/demo-realm
      Keycloak__Audience: dotnet-api
      Keycloak__PublicIssuer: http://localhost:8080/realms/demo-realm
      Keycloak__RequireHttpsMetadata: "false"
      Cors__AllowedOrigins__0: http://localhost:5173
    depends_on:
      - keycloak
    ports:
      - "${API_HTTP_PORT:-8081}:8080"

  reporting-api:
    build:
      context: ../backend
      dockerfile: src/KeycloakDemo.ReportingApi/Dockerfile
    container_name: keycloak-demo-reporting-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Keycloak__Authority: http://keycloak:8080/realms/demo-realm
      Keycloak__Audience: dotnet-api
      Keycloak__PublicIssuer: http://localhost:8080/realms/demo-realm
      Keycloak__RequireHttpsMetadata: "false"
      Cors__AllowedOrigins__0: http://localhost:5173
    depends_on:
      - keycloak
    ports:
      - "${REPORTING_API_HTTP_PORT:-8082}:8080"
